Mixer.Title="Broadcast Delay (Audio Mixer)"
DASH.Encoder="Encodeur DASH"
Info="Broadcast Delay - retarde l'audio et la vidéo en parfaite synchronisation.\n\nMODES\nSource : retarde une source unique (webcam, jeu, etc.).\nScène : retarde le rendu complet d'une scène + l'audio global (PC + micro).\nDocks : piloté par le dock Diffusion (sélection de scène centralisée).\n\nTAMPON VIDÉO\nDisque : longs délais SSD, stocké dans %TEMP%\BroadcastDelay\n    - RAW : pixel-perfect, ~500 Mo/s\n    - PNG : sans perte, ~120 Mo/s\n    - MJPEG : avec perte, ~25 Mo/s\n    - HLS/DASH : H.264, ~0.5-2 Mo/s (bitrate réglable)\nRAM : équilibré, ~0,5 Go/s en 1080p60\nVRAM : GPU, ~15s max en 1080p60, latence nulle\n\nTAMPON AUDIO\nRAM : PCM brut, ~384 ko/s (recommandé)\nDisque AAC : pour HLS/DASH, intégré aux segments\n\nJAUGE DE CONSOMMATION\nBarre verte en haut à gauche = remplissage buffer.\nPasse au rouge au-delà de 80% d'occupation.\n\nOVERLAY COMPTE À REBOURS\nÉcran noir + chiffres + barre en pause.\nActivation dans le dock Diffusion → Réglages.\n\nOPTIONS AVANCÉES\nActiver pour régler Budget, Compression, Qualité, Dossier, Durée.\nDésactivé = configuration optimale automatique.\n\nRACCOURCIS\nParamètres OBS → Raccourcis → chercher « Broadcast Delay »."


