Mixer.Title="Broadcast Delay (Audio Mixer)"
DASH.Encoder="Codificador DASH"
Info="Broadcast Delay - retarda el audio y el vídeo en perfecta sincronización.\n\nMODOS\nFuente: retarda una fuente única (webcam, juego, etc.).\nEscena: retarda el render completo de una escena + el audio global (PC + micro).\nDocks: controlado por el dock Difusión (selección de escena centralizada).\n\nBÚFER DE VÍDEO\nDisco: largos retardos SSD, almacenado en %TEMP%\BroadcastDelay\n    - RAW: pixel-perfect, ~500 MB/s\n    - PNG: sin pérdida, ~120 MB/s\n    - MJPEG: con pérdida, ~25 MB/s\n    - HLS/DASH: H.264, ~0.5-2 MB/s (bitrate ajustable)\nRAM: equilibrado, ~0.5 GB/s en 1080p60\nVRAM: GPU, ~15s max en 1080p60, latencia cero\n\nBÚFER DE AUDIO\nRAM: PCM bruto, ~384 KB/s (recomendado)\nDisco AAC: para HLS/DASH, integrado en los segmentos\n\nMEDIDOR DE CONSUMO\nBarra verde arriba a la izquierda = nivel de llenado.\nSe vuelve roja al superar el 80%.\n\nOVERLAY CUENTA ATRÁS\nPantalla negra + dígitos + barra en pausa.\nActivar en el dock Difusión -> Ajustes.\n\nOPCIONES AVANZADAS\nActivar para ajustar Presupuesto, Compresión, Calidad, Carpeta, Duración.\nDesactivado = configuración óptima automática.\n\nATALLAS\nAjustes OBS -> Atallos -> buscar Broadcast Delay."

