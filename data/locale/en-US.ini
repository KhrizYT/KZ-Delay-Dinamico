Mixer.Title="Broadcast Delay (Audio Mixer)"
DASH.Encoder="DASH encoder"
Info="Broadcast Delay - delays audio and video in perfect sync.\n\nMODES\nSource: delay a single source (webcam, game, etc.).\nScene: delay a full scene render + global audio (desktop + mic).\nDocks: driven by the Diffusion dock (centralized scene selection).\n\nVIDEO BUFFER\nDisk: long delays SSD, stored in %TEMP%\BroadcastDelay\n    - RAW: pixel-perfect, ~500 MB/s\n    - PNG: lossless, ~120 MB/s\n    - MJPEG: lossy, ~25 MB/s\n    - HLS/DASH: H.264, ~0.5-2 MB/s (bitrate adjustable)\nRAM: balanced, ~0.5 GB/s at 1080p60\nVRAM: GPU, ~15s max at 1080p60, zero latency\n\nAUDIO BUFFER\nRAM: PCM raw, ~384 KB/s (recommended)\nDisk AAC: for HLS/DASH, integrated into segments\n\nCONSUMPTION METER\nGreen bar top-left = buffer fill level.\nTurns red beyond 80% usage.\n\nCOUNTDOWN OVERLAY\nBlack screen + digits + bar during pause.\nToggle in Diffusion dock -> Settings.\n\nADVANCED OPTIONS\nEnable to adjust Budget, Compression, Quality, Folder, Duration.\nDisabled = automatic optimal configuration.\n\nHOTKEYS\nOBS Settings -> Hotkeys -> search Broadcast Delay."

